name: Enforce source branch
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited]

jobs:
  source-branch:
    name: source-branch
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "main" ]; then
            case "$HEAD" in
              dev|hotfix/*) echo "OK: $HEAD -> main" ;;
              *) echo "::error::main only accepts PRs from dev or hotfix/* (source: $HEAD)"; exit 1 ;;
            esac
          else
            echo "OK: PR into $BASE"
          fi
